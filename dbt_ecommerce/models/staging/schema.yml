version: 2

models:
  - name: stg_orders
    description: Dados tratados dos pedidos
    columns:
      - name: order_id
        description: Identificador do pedido
        data_tests:
          - unique
          - not_null

      - name: customer_id
        description: Identificador do cliente
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id

  - name: stg_customers
    description: Dados tratados dos clientes

    columns:
      - name: customer_id
        description: Identificador do cliente
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        description: Identificador único do cliente
        data_tests:
          - not_null
      - name: customer_state
        description: Estado do cliente
  
  - name: stg_payments
    description: Dados tratados dos pagamentos
    columns:
      - name: order_id
        description: Identificador do pedido
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: payment_sequential
        data_tests:
          - not_null
      - name: payment_value
        data_tests:
          - not_null
        
  - name: stg_products
    description: Dados tratados dos produtos
    columns:
      - name: product_id
        description: Identificador do produto
        data_tests:
          - unique
          - not_null

      - name: product_category_name
        description: Nome da categoria do produto


  - name: stg_order_items
    description: Dados tratados dos itens dos pedidos

    columns:
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id

      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

      - name: seller_id
        data_tests:
          - not_null

      - name: price
        data_tests:
          - not_null

      - name: freight_value
        data_tests:
          - not_null

  - name: stg_sellers
    description: Dados tratados dos vendedores
    columns:
      - name: seller_id
        description: Identificador do vendedor
        data_tests:
          - unique
          - not_null
      - name: seller_zip_code_prefix
        description: Prefixo do CEP do vendedor
        data_tests:
          - not_null
      - name: seller_city
        description: Cidade do vendedor
        data_tests:
          - not_null
      - name: seller_state
        description: Estado do vendedor
        data_tests:
          - not_null